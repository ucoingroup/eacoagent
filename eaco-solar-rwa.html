<!DOCTYPE html>
<html lang="zh" data-theme="solar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EACO × Solana｜光伏储能跨境绿色资金通道</title>
<meta name="description" content="EACO + SOL + USDT/USDC + eCNH 在 Solana 生态中服务光伏储能产业的跨境绿色资金通道概念方案。">
<style>
/* ============ 主题变量：日光绿能 Solar（默认 / 浅色） ============ */
:root{
  --bg:#f4f9f3; --bg2:#e9f3e8; --surface:#ffffff; --surface2:#f7fbf6;
  --text:#13261b; --text2:#3c5544; --muted:#6f8576;
  --line:#dcebdd; --line2:#c6ddc8;
  --a1:#0f9d58; --a2:#eea712; --a3:#2b86cf; --on-a1:#ffffff;
  --radius:22px; --radius-s:13px;
  --shadow:0 12px 34px rgba(20,70,38,.07); --shadow-h:0 20px 46px rgba(20,70,38,.14);
  --f-head:"Inter",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans JP",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --grad:linear-gradient(112deg,#0f9d58,#2b86cf 62%,#eea712);
  --grid:none; --maxw:1180px;
}
/* ============ 极光科技 Aurora（深色霓虹） ============ */
[data-theme="aurora"]{
  --bg:#070b14; --bg2:#0a1120; --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.075);
  --text:#eaf2ff; --text2:#b8c8df; --muted:#8194b0;
  --line:rgba(150,185,255,.15); --line2:rgba(150,185,255,.30);
  --a1:#3ce7c3; --a2:#8f83ff; --a3:#ffd06a; --on-a1:#04211b;
  --radius:16px; --radius-s:10px;
  --shadow:0 16px 46px rgba(0,0,0,.34); --shadow-h:0 22px 62px rgba(0,0,0,.55);
  --grad:linear-gradient(112deg,#3ce7c3,#8f83ff 55%,#ffd06a);
  --grid:linear-gradient(rgba(120,170,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.045) 1px,transparent 1px);
}
/* ============ 典藏白皮书 Paper（米白编辑风） ============ */
[data-theme="paper"]{
  --bg:#f3efe7; --bg2:#ece6d9; --surface:#fbf9f4; --surface2:#f7f2e8;
  --text:#211e18; --text2:#4c463b; --muted:#7d7565;
  --line:#dcd4c3; --line2:#bfb4a0;
  --a1:#a63d2b; --a2:#2f4739; --a3:#8a6a38; --on-a1:#ffffff;
  --radius:3px; --radius-s:2px;
  --shadow:none; --shadow-h:0 8px 22px rgba(60,45,25,.09);
  --f-head:Georgia,"Times New Roman","Songti SC","Noto Serif SC","SimSun",serif;
  --grad:linear-gradient(112deg,#a63d2b,#8a6a38);
  --grid:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--f-body);
  font-size:15px; line-height:1.72; -webkit-font-smoothing:antialiased;
  background-image:var(--grid); background-size:44px 44px;
  transition:background-color .45s ease,color .45s ease;
}
[data-theme="aurora"] body{
  background-image:radial-gradient(ellipse 60% 42% at 82% 4%,rgba(60,231,195,.13),transparent 70%),
    radial-gradient(ellipse 52% 38% at 6% 42%,rgba(143,131,255,.13),transparent 70%),var(--grid);
  background-size:auto,auto,44px 44px;
}
[data-theme="solar"] body{
  background-image:radial-gradient(ellipse 62% 36% at 88% 2%,rgba(238,167,18,.13),transparent 70%),
    radial-gradient(ellipse 55% 40% at 2% 46%,rgba(15,157,88,.11),transparent 70%);
}
[dir="rtl"] body{font-family:var(--f-body)}
a{color:inherit;text-decoration:none}
button,select{font-family:inherit;font-size:inherit}
::selection{background:var(--a1);color:var(--on-a1)}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:26px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ============ 顶部栏 ============ */
#progress{position:fixed;inset-block-start:0;inset-inline-start:0;height:2px;width:0;background:var(--grad);z-index:120;transition:width .1s linear}
header.bar{
  position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);
}
.bar-in{display:flex;align-items:center;gap:22px;min-height:66px}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;font-weight:800;letter-spacing:.02em;font-size:17px}
.brand .mark{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:var(--grad);color:#fff;font-size:15px;font-weight:900;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 14%,transparent);
}
.brand small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.08em;line-height:1.2}
nav.links{display:flex;gap:2px;margin-inline-start:auto;overflow:auto;scrollbar-width:none}
nav.links::-webkit-scrollbar{display:none}
nav.links a{padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--text2);white-space:nowrap;transition:.2s}
nav.links a:hover{background:var(--surface2);color:var(--a1)}
.controls{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.sel{
  appearance:none;background:var(--surface);color:var(--text);border:1px solid var(--line2);
  border-radius:9px;padding:7px 28px 7px 11px;font-size:12.5px;cursor:pointer;max-width:150px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;
}
.themes{display:flex;gap:3px;padding:3px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.themes button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11.5px;transition:.2s;white-space:nowrap}
.themes button[aria-pressed="true"]{background:var(--a1);color:var(--on-a1);font-weight:700}
[data-theme="paper"] .themes,[data-theme="paper"] .sel{border-radius:2px}

/* ============ 通用区块 ============ */
section{padding-block:78px;scroll-margin-top:74px}
.sec-head{max-width:780px;margin-bottom:42px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--a1);margin-bottom:14px;
}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--a1);border-radius:2px}
[dir="rtl"] .eyebrow::before{display:none}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.2;margin:0;letter-spacing:-.02em}
h2.sec-title{font-size:clamp(28px,4vw,42px);font-weight:800}
.sec-sub{margin-top:14px;color:var(--text2);font-size:16px;max-width:720px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);transition:transform .3s ease,box-shadow .3s ease,border-color .3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:var(--line2)}
[data-theme="aurora"] .card{backdrop-filter:blur(12px)}
[data-theme="aurora"] .card:hover{border-color:var(--a1);box-shadow:0 0 0 1px color-mix(in srgb,var(--a1) 50%,transparent),0 0 34px color-mix(in srgb,var(--a1) 16%,transparent)}
[data-theme="paper"] .card:hover{transform:none;border-color:var(--a1)}
[data-theme="paper"] section{border-top:1px solid var(--line2);padding-block:66px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:6px;background:color-mix(in srgb,var(--a1) 12%,transparent);color:var(--a1)}
[data-theme="paper"] .tag{border-radius:1px;background:transparent;border:1px solid var(--a1)}
.note{font-size:12.5px;color:var(--muted);line-height:1.65}
.reveal{opacity:1}
html.js-ready .reveal{opacity:0;transform:translateY(20px);transition:opacity .65s ease,transform .65s ease}
html.js-ready .reveal.in{opacity:1;transform:none}

/* ============ Hero ============ */
.hero{padding-block:88px 72px;position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,66px);font-weight:850;letter-spacing:-.045em}
.hero .sub{margin-top:20px;font-size:18px;color:var(--text2);max-width:560px;line-height:1.65}
.hero .desc{margin-top:14px;font-size:14px;color:var(--muted);max-width:560px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{padding:12px 22px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid transparent;transition:.25s;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--a1);color:var(--on-a1)}
.btn.pri:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn.gho{background:transparent;border-color:var(--line2);color:var(--text)}
.btn.gho:hover{border-color:var(--a1);color:var(--a1)}
[data-theme="paper"] .btn{border-radius:2px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:36px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px}
.chip b{display:block;font-size:14px;color:var(--a1);font-family:var(--f-mono)}
.chip span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:56px;border-top:1px solid var(--line);padding-top:26px}
.stats div b{display:block;font-family:var(--f-head);font-size:20px;letter-spacing:-.02em}
.stats div span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.orbit{width:100%;max-width:400px;margin-inline:auto;display:block}
[data-theme="aurora"] .orbit{filter:drop-shadow(0 0 18px rgba(60,231,195,.25))}

/* ============ 内容组件 ============ */
.pain .card{border-inline-start:3px solid var(--a3)}
.pain .card h3{font-size:17px;margin-bottom:9px}
.pain .card p{margin:0;color:var(--text2);font-size:13.5px;line-height:1.7}
.pain .num{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block;margin-bottom:12px}
.layer{display:flex;gap:18px}
.layer .lv{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;font-family:var(--f-mono)}
[data-theme="paper"] .layer .lv{border-radius:1px;background:var(--a1)}
.layer h3{font-size:17px;margin-bottom:7px}
.layer p{margin:0 0 10px;color:var(--text2);font-size:13.5px}
.layer ul{margin:0;padding-inline-start:17px;color:var(--muted);font-size:12.5px}
.layer li{margin-bottom:3px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:13px}
th,td{padding:15px 16px;text-align:start;border-bottom:1px solid var(--line)}
th{background:var(--surface2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-weight:800;font-family:var(--f-mono);color:var(--a1);white-space:nowrap}
td.yes{color:var(--a1);font-weight:700}
td.no{color:var(--muted)}
.flowcard{display:flex;flex-direction:column}
.flowcard .fhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.flowcard .fno{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;font-family:var(--f-mono);color:var(--a1);flex:0 0 auto}
.flowcard h3{font-size:17px}
.flowcard>p{color:var(--text2);font-size:13.5px;margin:0 0 18px}
.steps{list-style:none;margin:0;padding:0;position:relative;flex:1}
.steps::before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:12px;width:2px;background:var(--line2)}
.steps li{position:relative;padding-inline-start:28px;padding-bottom:15px}
.steps li::before{content:"";position:absolute;inset-inline-start:1px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--a1)}
.steps b{display:block;font-size:13px}
.steps span{display:block;font-size:12px;color:var(--muted);line-height:1.6}
.fvalue{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line2);font-size:12.5px;color:var(--a1);font-weight:600}
.route{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-top:12px}
.rnode{flex:1 1 175px;min-width:165px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:18px;position:relative}
.rnode b{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--a1);margin-bottom:8px}
.rnode h4{font-size:14px;margin-bottom:6px}
.rnode p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.rarrow{display:grid;place-items:center;flex:0 0 34px;color:var(--a1);font-size:20px;font-weight:800}
[dir="rtl"] .rarrow{transform:scaleX(-1)}
.oneline{padding:20px 24px;border-inline-start:4px solid var(--a1);background:var(--surface2);border-radius:var(--radius-s);font-size:16px;font-weight:600;margin-bottom:26px}
[data-theme="paper"] .oneline{border-radius:1px}
.eitem h3{font-size:16px;margin:12px 0 8px}
.eitem p{margin:0;font-size:13px;color:var(--text2);line-height:1.7}
.eitem .ei{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 13%,transparent);color:var(--a1);font-weight:800;font-family:var(--f-mono);font-size:13px}
.bound{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.bound .box{border:1px solid var(--line);border-radius:var(--radius-s);padding:20px;background:var(--surface)}
.bound .box.no{border-color:color-mix(in srgb,var(--a1) 30%,transparent)}
.bound h4{font-size:14px;margin-bottom:12px}
.bound ul{margin:0;padding-inline-start:18px;font-size:13px;color:var(--text2);line-height:1.9}
.roaditem{position:relative;padding-inline-start:30px;padding-bottom:28px}
.roaditem::before{content:"";position:absolute;inset-inline-start:7px;top:10px;bottom:-6px;width:2px;background:var(--line2)}
.roaditem:last-child::before{display:none}
.roaditem::after{content:"";position:absolute;inset-inline-start:1px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 16%,transparent)}
.roaditem .ph{font-family:var(--f-mono);font-size:11px;font-weight:800;color:var(--a1);letter-spacing:.08em}
.roaditem h3{font-size:18px;margin:5px 0 6px}
.roaditem p{margin:0;font-size:13.5px;color:var(--text2)}
.faqgroup{margin-bottom:26px}
.faqgroup>h3{font-size:15px;color:var(--a1);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.faqgroup>h3 span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:9px;overflow:hidden}
details[open]{border-color:var(--line2);box-shadow:var(--shadow)}
summary{padding:15px 18px;cursor:pointer;font-weight:650;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--a1);flex:0 0 auto;line-height:1}
details[open] summary::after{content:"−"}
details .ans{padding:0 18px 16px;font-size:13.5px;color:var(--text2);line-height:1.75}

/* ============ 页脚 / EACO 资料 ============ */
footer{border-top:1px solid var(--line2);background:var(--bg2);padding-block:70px 30px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:42px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:13.5px;align-items:start}
.dl dt{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:2px}
.dl dd{margin:0;font-weight:600;text-align:start}
.ca{background:var(--surface);border:1px dashed var(--a1);border-radius:var(--radius-s);padding:14px;margin-top:14px}
.ca code{display:block;font-family:var(--f-mono);font-size:11.5px;word-break:break-all;line-height:1.7;color:var(--text)}
.ca .cawarn{margin-top:8px;font-size:12px;font-weight:800;color:var(--a1)}
.calinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.calinks a{font-size:11.5px;padding:6px 11px;border:1px solid var(--line2);border-radius:8px;color:var(--text2);transition:.2s}
.calinks a:hover{border-color:var(--a1);color:var(--a1);background:var(--surface)}
[data-theme="paper"] .calinks a{border-radius:1px}
.four{margin-top:22px;padding:18px;background:var(--surface);border-radius:var(--radius-s);border-inline-start:3px solid var(--a1)}
.four .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:9px}
.four p{margin:0 0 6px;font-size:13px;font-weight:650}
.four .alt{font-size:11.5px;color:var(--muted);font-weight:400}
.goals{margin:16px 0 0;padding-inline-start:19px;font-size:13px;color:var(--text2);line-height:1.95}
.supreme{margin-top:18px;font-size:14px;font-weight:800;padding:13px 16px;background:var(--grad);color:#fff;border-radius:var(--radius-s)}
.linkgroups{display:grid;gap:18px}
.linkgroup h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.linkgroup .items{display:flex;flex-wrap:wrap;gap:7px}
.linkgroup a{font-size:12px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text2);transition:.2s;display:inline-flex;align-items:center;gap:5px}
.linkgroup a:hover{border-color:var(--a1);color:var(--a1);transform:translateY(-2px)}
[data-theme="paper"] .linkgroup a{border-radius:1px}
.linkgroup a::after{content:"↗";font-size:10px;opacity:.55}
.disclaimer{margin-top:38px;padding:20px 22px;border:1px solid var(--line2);border-radius:var(--radius-s);background:var(--surface)}
.disclaimer h4{font-size:13px;color:var(--a1);margin-bottom:8px}
.disclaimer p{margin:0;font-size:12px;color:var(--muted);line-height:1.8}
.foot-end{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.totop{position:fixed;inset-inline-end:22px;bottom:22px;width:42px;height:42px;border-radius:50%;background:var(--a1);color:var(--on-a1);border:0;cursor:pointer;box-shadow:var(--shadow-h);opacity:0;pointer-events:none;transition:.3s;font-size:17px;z-index:90}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{transform:translateY(-3px)}
[data-theme="paper"] .totop{border-radius:1px}

/* ============ 响应式 ============ */
@media(max-width:960px){
  .hero-in{grid-template-columns:1fr;gap:26px}
  .orbit{max-width:290px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:1fr}
  nav.links{display:none}
}
@media(max-width:640px){
  .wrap{padding-inline:18px}
  section{padding-block:54px}
  .hero{padding-block:56px 46px}
  .g2,.g3,.g4,.bound,.chips{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr);gap:18px}
  .bar-in{gap:10px;flex-wrap:wrap;padding-block:10px}
  .brand{font-size:15px}
  .controls{margin-inline-start:auto}
  .themes button{padding:4px 6px;font-size:10.5px}
  .sel{max-width:112px;font-size:11.5px}

"faq":{"eyebrow":"09 / PREGUNTAS",

"groups":[{"n":"Conceptos básicos",
"qa":[["¿Qué es este corredor de capital verde?","Un corredor programable sobre Solana para proyectos solares y de almacenamiento en el exterior: las stablecoins liquidan obras e ingresos, EACO gobierna la admisión verde y los contratos liberan fondos por hitos."],["¿Por qué Solana como capa base?","Alto rendimiento y bajas comisiones se adaptan a datos IoT de alta frecuencia, muchas cuentas PDA y distribuciones RWA por lotes con coste controlado."]]},{"n":"Utilidad de EACO",
"qa":[["¿Es EACO una moneda de liquidación?","No. Principal, pagos de obra y distribuciones usan USDT/USDC/eCNH. EACO es un credencial de gobernanza, calificación, incentivos y arbitraje que no porta principal."],["¿Cómo interviene EACO en las disputas?","Un jurado de expertos con stake vota sobre las pruebas; el veredicto es solo un interruptor que se pasa al contrato. Los jurados no pueden transferir fondos."]]},{"n":"Flujos de trabajo",
"qa":[["¿Cómo se liberan los pagos de obra?","El supervisor sube el acta de recepción y los IoT los datos de conexión; tras la verificación del oráculo, el contrato libera al beneficiario la proporción prefijada."],["¿Cómo se gestiona la retención?","Queda bloqueada en un PDA separado con bloqueo temporal y condicional. Las reclamaciones en garantía pasan por arbitraje antes de cualquier deducción."]]},{"n":"Tecnología",
"qa":[["¿Por qué un PDA por proyecto?","Aislamiento de activos. Una disputa, congelación o reclamación en un proyecto no afecta a otros pools de capital verde."],["¿Se guarda on-chain todo el dato bruto?","No. El detalle permanece off-chain; la cadena guarda resúmenes hash y resultados de verificación, equilibrando inmutabilidad y coste."]]},{"n":"Cumplimiento y riesgo",
"qa":[["¿Se puede captar inversores locales?","No. La ruta de fondos, los SPV y el KYC son estructuras offshore compliant. Los proyectos domésticos solo pueden usar atestación on-chain."],["¿Las participaciones RWA tienen principal garantizado?","No. Los ingresos dependen de tarifa, irradiación, O&M y riesgo local, como cualquier inversión convencional. Nada aquí promete rentabilidad."]]},{"n":"Valor del ecosistema",
"qa":[["¿Qué dolor del sector alivia?","Empareja capital verde de largo plazo con flujos de caja de 25 años, reduce la fricción de liquidación y cumplimiento, y combate el greenwashing con evidencia on-chain."],["¿Qué puede hacer un miembro normal?","Aportar pistas de proyectos o denunciar presuntos proyectos verdes falsos. Las pistas verificadas pueden ganar un pequeño incentivo EACO sin stake."]]}]},

"qa":[["Qu'est-ce que ce corridor de capitaux verts ?","Un corridor programmable sur Solana pour les projets solaires et de stockage à l'étranger : les stablecoins règlent travaux et revenus, EACO gouverne l'admission verte et les contrats débloquent les fonds par jalons."],["Pourquoi Solana comme couche de base ?","Débit élevé et faibles frais conviennent aux données IoT haute fréquence, aux nombreux comptes PDA et aux distributions RWA par lots à coût maîtrisé."]]},{"n":"Utilité d'EACO",
"qa":[["EACO est-il une monnaie de règlement ?","Non. Principal, paiements de travaux et distributions utilisent USDT/USDC/eCNH. EACO est un titre de gouvernance, de notation, d'incitation et d'arbitrage, sans principal."],["Comment EACO intervient-il dans les litiges ?","Un jury d'experts avec stake vote sur les preuves ; le verdict n'est qu'un interrupteur transmis au contrat. Les jurés ne peuvent pas transférer les fonds."]]},{"n":"Flux de travail",
"qa":[["Comment les paiements de travaux sont-ils débloqués ?","Le superviseur dépose le PV de réception et les IoT les données de raccordement ; après vérification par l'oracle, le contrat libère la part prévue au bénéficiaire."],["Comment la retenue est-elle gérée ?","Elle est verrouillée dans un PDA séparé avec verrou temporel et conditionnel. Les réclamations sous garantie passent par arbitrage avant toute retenue."]]},{"n":"Technologie",
"qa":[["Pourquoi un PDA par projet ?","Isolation des actifs. Un litige, un gel ou une réclamation sur un projet ne peut affecter les autres pools de capitaux verts."],["Toutes les données brutes sont-elles on-chain ?","Non. Le détail reste off-chain ; la chaîne conserve les empreintes de hachage et les résultats de vérification, conciliant immuabilité et coût."]]},{"n":"Conformité et risque",
"qa":[["Peut-on solliciter des investisseurs domestiques ?","Non. La route des fonds, les SPV et le KYC relèvent de structures offshore conformes. Les projets domestiques ne peuvent utiliser que l'attestation on-chain."],["Les parts RWA sont-elles garanties en principal ?","Non. Les revenus dépendent du tarif, de l'ensoleillement, de l'O&M et du risque local, comme tout investissement classique. Rien ici ne promet de rendement."]]},{"n":"Valeur écosystémique",
"qa":[["Quelle douleur sectorielle soulage l'approche ?","Elle aligne des capitaux verts longs sur le cash-flow de 25 ans d'une centrale, réduit les frictions de règlement et d'exécution, et combat le greenwashing par la preuve on-chain."],["Que peut faire un membre ordinaire ?","Signaler des pistes de projets ou dénoncer de présumés faux projets verts. Les pistes vérifiées peuvent gagner une petite incitation EACO sans stake."]]}]},

"items":[["① بوابة القبول الأخضر","تُقدّم المشاريع دراسة الجدوى و PPA والتراخيص والتأمين، ولا يُفتح خزان الحجز إلا بتصويت DAO الخاص بـ EACO؛ تُرفض مشاريع الغسل الأخضر والمخاطر العالية."],["② حوافز تدقيق موثوق","المشرفون والمفتشون وفرق الصيانة يرهنون EACO للتحقق الميداني. العمل الصادق يُكافأ، والتزوير يُصادر الرهن ويدرج في القائمة السوداء."],["③ تحكيم لامركزي","نزاع الاستلام يوقف الدفع. هيئة من مهندسي الطاقة والمحامين العابرين للحدود وخبراء EPC المراهنين تفصل في الأدلة: تُصدر حكماً ولا تمس الأموال."],["④ خزانة السلوك الأخضر","التوليد المستمر، وانخفاض الإهدار، وإعادة تدوير الألواح، والشمول خارج الشبكة تحصل على حوافز مرجّحة، تحوّل خفض الانبعاثات وشمول الطاقة إلى قيمة قابلة للقياس."],["⑤ حوكمة معلمات البروتوكول","الرسوم، ومدد حجز الضمان، ونطاقات التحوط، وتوجيه الخزانة، وترقية العقود، كلها بمقترح وتصويت في DAO."],["⑥ الكهرباء الخضراء والسمعة","رموز NFT للكهرباء الخضراء تحمل تأييد EACO لتقارير ESG والكربون، وسجل إنجاز المقاولين يتراكم في ملف ائتماني قابل للاستعلام."]]},

"qa":[["Является ли EACO расчётной валютой?","Нет. Основная сумма, оплата работ и выплаты идут в USDT/USDC/eCNH. EACO — инструмент управления, рейтинга, стимулов и арбитража, не несущий основной суммы."],["Как EACO участвует в спорах?","Жюри экспертов со стейком голосует по доказательствам; вердикт — лишь переключатель для контракта. Жюри не может напрямую переводить средства."]]},{"n":"Процессы",

  {t:P('③ Token-2022 合规层（仅结算侧）','3. Token-2022 compliance (settlement side only)'),d:P('Transfer Hook 白名单、OFAC 制裁地址拦截、Freeze 权限交由合规多签且每次冻结附理由 memo、KYC 原始信息不上链、只对接持牌 on/off-ramp；这套管控只作用于 USDC/USDT/eCNH 与 RWA 份额，不作用于 EACO。','Transfer Hook allowlist, OFAC screening, freeze authority under a compliance multisig with a reason memo on every freeze, KYC data kept off-chain, licensed on/off-ramps only — applied solely to USDC/USDT/eCNH and RWA shares, never to EACO.')},
  {t:P('④ EACO 治理层','4. EACO governance layer'),d:P('质押才有治理权、线性权重并设锁仓期；仲裁陪审团随机轮换 + 双边保证金；国库与工程资金隔离；属地资质、保险、制裁风险为一票否决项；提案在时间锁窗口内可紧急暂停。','Governance requires staking, linear weight and lock-up; random juror rotation with bilateral deposits; treasury isolated from project funds; missing permits, insurance or sanctions risk are veto items; proposals can be paused during the timelock.')},
  {t:P('⑤ 链上监控与应急','5. Monitoring & incident response'),d:P('7×24 链上 Bot 监控 PDA 大额异动、预言机漂移、异常调用与批量转账；三级告警（通知 / 单项目暂停 / 全通道暂停）；独立审计看板可导出报表；多 RPC 冗余 + durable nonce 防重放。','24/7 bots watch large PDA outflows, oracle drift, anomalous calls and bulk transfers; three alert levels (notify / pause project / pause all); exportable audit dashboard; redundant RPC providers and durable nonces against replay.')},
  {t:P('⑥ 金融与地缘风险隔离','6. Financial & geopolitical isolation'),d:P('汇率预言机设硬阈值与对冲额度上限；A/B/C 评级对应资金上限与保证金梯度；工程一切险、履约险、地缘险为准入前置；地缘突发按合约预设路径暂停与退回；RWA 不保本，国库不兜底本金损失。','Hard FX thresholds and hedging caps; tiered funding caps and deposit gradients by A/B/C rating; CAR, performance and political-risk insurance required for admission; geopolitical events follow pre-coded pause or refund paths; no principal guarantee, no treasury bail-out.')},
  {t:P('⑦ 角色与权限最小化','7. Least-privilege roles'),d:P('合规团队无划转权、安全运维只能暂停不能放款、审计节点只能提交证据、仲裁陪审团只输出裁决开关、多签委员会仅处理升级与国库支出；任一角色都无法单独放款。','Compliance has no transfer rights; ops can pause but not release; auditors submit evidence only; jurors emit a verdict switch only; the multisig handles upgrades and treasury only — no single role can release funds.')}
 ],

/* ---------- 渲染 ---------- */
function render(){
 var d=merge(DICT.en||{},DICT[lang]);CUR=d;
 var meta=LANGS.filter(function(l){return l.c===lang;})[0]||LANGS[0];
 document.documentElement.lang=lang;
 document.documentElement.dir=meta.dir;
 document.documentElement.setAttribute('data-theme',theme);
 document.title=d.title;
 var bs=$('[data-ui="brandsub"]');if(bs)bs.textContent=d.brandsub;
 $('#nav').innerHTML=d.nav.map(function(n,i){return '<a href="#'+NAV_IDS[i]+'">'+esc(n)+'</a>';}).join('');
 $('#langSel').innerHTML=LANGS.map(function(l){return '<option value="'+l.c+'"'+(l.c===lang?' selected':'')+'>'+esc(l.n)+'</option>';}).join('');
 $('#themeBtns').innerHTML=THEMES.map(function(t){return '<button type="button" data-theme-set="'+t.c+'" aria-pressed="'+(t.c===theme)+'">'+esc(d.ui['t'+t.k])+'</button>';}).join('');
 $('#app').innerHTML=[
  heroHTML(d),painHTML(d),archHTML(d),roleHTML(d),flowHTML(d),routeHTML(d),
  eacoHTML(d),riskHTML(d),roadHTML(d),faqHTML(d),
  securityHTML(d),specHTML(d),industryHTML(d),benefitsHTML(d),positiveHTML(d),
  footerHTML(d),vowHTML(d)
 ].join('');
 bindReveal();onScroll();
}
function bindReveal(){
 if(IO)IO.disconnect();
 var sel='.sec-head,.card,.rnode,.faqgroup,.roaditem,.tblwrap,.bound .box,.four,.disclaimer,.stats,.chips,.oneline,.dl,.supreme,.linkgroups,.mod,.bcard,.impact,.vbox,.subhead,.vow';
 var els=[].slice.call(document.querySelectorAll(sel));
 els.forEach(function(e,i){e.classList.add('reveal');e.style.transitionDelay=(i%4*55)+'ms';});
 if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in');});return;}
 IO=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');IO.unobserve(en.target);}});},{threshold:.06,rootMargin:'0px 0px -24px 0px'});
 els.forEach(function(e){IO.observe(e);});
}
function onScroll(){
 var h=document.documentElement,max=h.scrollHeight-h.clientHeight;
 $('#progress').style.width=(max>0?(h.scrollTop/max*100):0)+'%';
 $('#totop').classList.toggle('show',h.scrollTop>520);
}

/* ---------- 事件（委托，绑定一次） ---------- */
document.addEventListener('change',function(e){
 if(e.target&&e.target.id==='langSel'){lang=e.target.value;store('eaco_lang',lang);render();}
});
document.addEventListener('click',function(e){
 var t=e.target;if(!t||!t.closest)return;
 var b=t.closest('[data-theme-set]');
 if(b){theme=b.getAttribute('data-theme-set');store('eaco_theme',theme);render();return;}
 var c=t.closest('[data-copy]');
 if(c){var done=function(){var old=c.textContent;c.textContent=CUR.ui.copied;setTimeout(function(){c.textContent=CUR.ui.copy;},1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(COMMUNITY.ca).then(done,function(){fallbackCopy();});}
  else fallbackCopy();
  return;}
 if(t.closest('#totop')){window.scrollTo({top:0,behavior:'smooth'});}
});
function fallbackCopy(){
 var ta=document.createElement('textarea');ta.value=COMMUNITY.ca;ta.style.position='fixed';ta.style.opacity='0';
 document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}
 document.body.removeChild(ta);
 var c=$('[data-copy]');if(c){c.textContent=CUR.ui.copied;setTimeout(function(){c.textContent=CUR.ui.copy;},1800);}
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll,{passive:true});

document.documentElement.classList.add('js-ready');
render();
})();
</script>
