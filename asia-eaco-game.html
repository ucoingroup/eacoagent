.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.page-head{margin-bottom:16px}

.kpi{padding:14px 16px}

let state=null, uidN=0, toastTimer=null, searchTimer=null;
function uid(p){uidN++;return p+'-'+Date.now().toString(36).toUpperCase()+'-'+uidN.toString(36).toUpperCase()}
function round(n){return Math.round((n+Number.EPSILON)*100)/100}
function money(n){const v=Math.abs(round(n));return (n<0?'-':'')+v.toLocaleString(state.lang==='zh'?'zh-CN':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function tsStr(x){const d=new Date(x),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function dayKey(x){const d=new Date(x),p=n=>String(n).padStart(2,'0');return p(d.getMonth()+1)+'/'+p(d.getDate())}
function region(c){return REGIONS.find(r=>r.c===c)||REGIONS[0]}
function unitOf(c){return region(c).w==='friendly'?'EACO':'CNH'}
function canWeb3(c){return region(c).w==='friendly'}
function schemeOf(c){return canWeb3(c)?'A':'B'}
function schemeChip(s){return '<span class="chip '+(s==='A'?'a':'y')+'">'+t('scheme.'+s.toLowerCase())+'</span>'}
function b58(n){let s='';for(let i=0;i<n;i++)s+=B58[Math.floor(Math.random()*B58.length)];return s}
function chainOf(unit){return unit==='EACO'?'solana':'offchain'}
function member(id){return state.members.find(m=>m.id===id)}
function service(id){return SERVICES.find(s=>s.id===id)||SERVICES[0]}
function accountName(a){if(SYS[a])return state.lang==='zh'?SYS[a][0]:SYS[a][1];const m=member(a);return m?m.name:(a||'-')}
function svcName(s){return state.lang==='zh'?s.zh:s.en}
function regionName(r){return state.lang==='zh'?r.zh:r.en}
function roleName(r){return t('role.'+r)}
function catName(c){const x=CATS[c]||[c,c];return state.lang==='zh'?x[0]:x[1]}

function freshState(){
 return {v:1,lang:state?state.lang:'zh',theme:state?state.theme:'kr',view:'dash',
  members:[],orders:[],entries:[],log:[],notes:'',
  draft:{memberId:'',serviceId:'S1',qty:1,diff:1,usePoints:true},
  filters:{unit:'ALL',type:'ALL',q:''},seq:1};
}
function balOf(a,u){let b=0;for(const e of state.entries)if(e.a===a&&e.unit===u)b+=e.d;return round(b)}
function logEvent(zh,en){
 state.log.push({ts:Date.now(),m:bi(zh,en)});
 if(state.log.length>400)state.log=state.log.slice(-400);
}
function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(state));
  localStorage.setItem(TXTKEY,buildTxt());

 }catch(err){console.warn('localStorage unavailable',err)}
}
function toast(msg){if(!msg)return;const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2600)}

/* ---------- 4. ledger core: balanced double-entry ---------- */
function post(unit,lines,type,note,ref,oid,at){
 const jid=uid('J'),when=at||Date.now(),r=ref||'';
 const chain=chainOf(unit),slot=unit==='EACO'?Math.floor(280000000+Math.random()*9000000):0;
 lines.forEach(l=>{
  const bal=round(balOf(l.a,unit)+l.d);
  state.entries.push({id:uid('E'),jid:jid,ts:when,type:type,unit:unit,a:l.a,d:round(l.d),bal:bal,ref:r,oid:oid||'',note:note,chain:chain,slot:slot});
 });
}
function txRef(unit,at){
 if(unit==='EACO')return b58(64);
 const d=new Date(at||Date.now()),p=n=>String(n).padStart(2,'0');
 return 'VCH-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+String(state.seq++).padStart(4,'0');
}
function shortRef(r){return !r?'-':(r.length>26?r.slice(0,10)+'…'+r.slice(-8):r)}
function topup(mid,amount,at,ref,forceUnit){
 const m=member(mid);if(!m)return;
 const u=forceUnit||m.unit,x=round(amount);
 post(u,[{a:'__EXT__',d:-x},{a:mid,d:x}],'topup',bi('积分充值 '+money(x)+' '+u+'（'+m.name+'）','Top-up '+money(x)+' '+u+' ('+m.name+')'),ref||txRef(u,at),'',at);
 logEvent('充值 '+money(x)+' '+u+' · '+m.name,'Top-up '+money(x)+' '+u+' · '+m.name);
}
function placeOrder(d,at){
 const m=member(d.memberId);if(!m)return null;
 const s=service(d.serviceId),u=m.unit;
 const qty=Math.max(1,Math.round(Number(d.qty)||1)),dm=Number(d.diff)>0?Number(d.diff):1;
 const base=round(s.p*qty*dm);
 const maxOff=round(base*.3);
 const off=d.usePoints?round(Math.min(Math.max(0,balOf(m.id,u)),maxOff)):0;
 const pay=round(base-off);
 const o={id:uid('O'),mid:m.id,sid:s.id,region:m.region,unit:u,qty:qty,diff:dm,
  base:base,off:off,pay:pay,status:'pending',bid:'',channel:'',ref:'',ts:at||Date.now(),
  commission:0,reward:0,retain:0};
 state.orders.push(o);
 logEvent('创建订单 '+o.id+' · '+svcName(s)+' · '+money(base)+' '+u,'Order '+o.id+' created · '+svcName(s)+' · '+money(base)+' '+u);
 return o;
}
function payOrder(id,channel,at){
 const o=state.orders.find(x=>x.id===id);if(!o||o.status!=='pending')return false;
 const when=at||Date.now(),ref=txRef(o.unit,when);
 if(o.off>0)post(o.unit,[{a:o.mid,d:-o.off},{a:'__PLATFORM__',d:o.off}],'offset',bi('订单 '+o.id+' 积分抵扣','Points offset for '+o.id),ref,id,when);
 post(o.unit,[{a:'__EXT__',d:-o.pay},{a:'__PLATFORM__',d:o.pay}],'payment',bi('订单 '+o.id+' 在线支付 · '+channel,'Online payment for '+o.id+' · '+channel),ref,id,when);
 o.status='paid';o.channel=channel;o.ref=ref;o.paidAt=when;
 logEvent('订单 '+o.id+' 在线支付 '+money(o.pay)+' '+o.unit+' · '+channel,'Payment for '+o.id+' · '+money(o.pay)+' '+o.unit+' · '+channel);
 return true;
}
function assignOrder(id,bid,at){
 const o=state.orders.find(x=>x.id===id);if(!o||o.status!=='paid')return false;
 const b=member(bid);if(!b||b.unit!==o.unit||b.role!=='booster')return false;
 o.bid=bid;o.status='assigned';o.assignedAt=at||Date.now();
 logEvent('订单 '+o.id+' 派单给 '+b.name,'Order '+o.id+' assigned to '+b.name);
 return true;
}
function cancelOrder(id,at){
 const o=state.orders.find(x=>x.id===id);if(!o||o.status==='done'||o.status==='cancelled')return false;
 const when=at||Date.now(),ref='RF-'+o.ref.replace(/^0x|^VCH-/,'');
 if(o.status!=='pending'){
  post(o.unit,[{a:'__PLATFORM__',d:-o.pay},{a:'__EXT__',d:o.pay}],'refund',bi('订单 '+o.id+' 原路退款','Refund for '+o.id),ref,id,when);
  if(o.off>0)post(o.unit,[{a:'__PLATFORM__',d:-o.off},{a:o.mid,d:o.off}],'refund',bi('订单 '+o.id+' 返还抵扣积分','Return offset points for '+o.id),ref,id,when);
 }
 o.status='cancelled';o.cancelledAt=when;
 logEvent('订单 '+o.id+' 取消并红冲 '+money(o.pay)+' '+o.unit,'Order '+o.id+' cancelled, reversed '+money(o.pay)+' '+o.unit);
 return true;
}
function finishOrder(id,at){
 const o=state.orders.find(x=>x.id===id);if(!o||!['assigned','working','paid'].includes(o.status)||!o.bid)return false;
 const when=at||Date.now(),ref=o.ref;
 const com=round(o.pay*.7),rew=round(o.pay*.05),ret=round(o.pay-com-rew);
 post(o.unit,[{a:'__PLATFORM__',d:-com},{a:o.bid,d:com}],'commission',bi('订单 '+o.id+' 带打佣金','Booster commission for '+o.id),ref,id,when);
 post(o.unit,[{a:'__PLATFORM__',d:-rew},{a:o.mid,d:rew}],'reward',bi('订单 '+o.id+' 客户返利','Client reward for '+o.id),ref,id,when);
 o.commission=com;o.reward=rew;o.retain=ret;o.status='done';o.doneAt=when;
 logEvent('订单 '+o.id+' 验收完成 · 佣金 '+money(com)+' / 返利 '+money(rew)+' / 留存 '+money(ret),'Order '+o.id+' delivered · commission '+money(com)+' / reward '+money(rew)+' / retained '+money(ret));
 return true;
}
function withdraw(mid,x){
 const m=member(mid);if(!m||x<=0)return false;
 if(balOf(mid,m.unit)<x)return 'insufficient';
 post(m.unit,[{a:mid,d:-x},{a:'__EXT__',d:x}],'withdraw',bi('结算提现 '+money(x)+' '+m.unit,'Withdrawal '+money(x)+' '+m.unit),txRef(m.unit),'');
 logEvent('结算提现 '+money(x)+' '+m.unit+' · '+m.name,'Withdrawal '+money(x)+' '+m.unit+' · '+m.name);
 return true;
}
function exchange(mid,dir,x){
 const m=member(mid);if(!m||x<=0)return false;
 if(!canWeb3(m.region))return 'noEaco';
 const from=dir==='c2e'?'CNH':'EACO',to=dir==='c2e'?'EACO':'CNH';
 if(balOf(mid,from)<x)return 'insufficient';
 const ref='EX-'+txRef('CNH').replace('VCH-','');
 post(from,[{a:mid,d:-x},{a:'__BRIDGE__',d:x}],'exchange',bi('兑换付出 '+money(x)+' '+from,'Exchange out '+money(x)+' '+from),ref,'');
 post(to,[{a:'__BRIDGE__',d:-x},{a:mid,d:x}],'exchange',bi('兑换收入 '+money(x)+' '+to+'（1:1 锚定）','Exchange in '+money(x)+' '+to+' (1:1 anchor)'),ref,'');
 logEvent('兑换 '+money(x)+' '+from+' → '+to+' · '+m.name,'Exchange '+money(x)+' '+from+' to '+to+' · '+m.name);
 return true;
}
function addMember(name,role,reg,initial){
 const m={id:uid('M'),name:name,role:role,region:reg,unit:unitOf(reg),joined:Date.now()};
 state.members.push(m);
 if(initial>0)topup(m.id,round(initial));
 logEvent('新增成员 '+m.name+' · '+regionName(region(reg))+' · '+m.unit,'Member added '+m.name+' · '+regionName(region(reg))+' · '+m.unit);
 return m;
}
function removeMember(id){const m=member(id);state.members=state.members.filter(x=>x.id!==id);if(m)logEvent('移除成员 '+m.name,'Member removed '+m.name)}
function changeRegion(id,reg){
 const m=member(id);if(!m)return false;
 if(m.region===reg)return 'same';
 const nu=unitOf(reg);
 if(nu==='CNH'&&balOf(id,'EACO')>0)return 'blocked';
 m.region=reg;m.unit=nu;
 logEvent(m.name+' 切换地区至 '+regionName(region(reg))+' · '+nu,m.name+' moved to '+regionName(region(reg))+' · '+nu);
 return true;
}
function unitNet(u){let s=0;for(const e of state.entries)if(e.unit===u)s+=e.d;return round(s)}
function ledgerBalanced(){return unitNet('EACO')===0&&unitNet('CNH')===0}
function turnover(u){let s=0;for(const e of state.entries)if(e.unit===u&&e.a==='__PLATFORM__'&&e.d>0&&(e.type==='payment'||e.type==='offset'))s+=e.d;return round(s)}

function b64encode(str){
 const bytes=new TextEncoder().encode(str);let bin='';
 for(let i=0;i<bytes.length;i+=4096)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+4096));
 return btoa(bin);
}
function b64decode(s){
 const bin=atob(s),bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new TextDecoder().decode(bytes);
}

 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="150" role="img" aria-label="7 day activity">';

  s+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+d.n+'</text>';

function quoteVals(){
 const d=state.draft,m=member(d.memberId),s=service(d.serviceId);
 if(!m)return null;
 const qty=Math.max(1,Math.round(Number(d.qty)||1)),dm=Number(d.diff)>0?Number(d.diff):1;
 const base=round(s.p*qty*dm);
 const off=d.usePoints?round(Math.min(Math.max(0,balOf(m.id,m.unit)),round(base*.3))):0;
 return {m:m,s:s,u:m.unit,base:base,off:off,pay:round(base-off),bal:balOf(m.id,m.unit)};
}

const VIEWFN={dash:viewDash,scheme:viewScheme,services:viewServices,orders:viewOrders,ledger:viewLedger,team:viewTeam,memory:viewMemory};
function render(){
 renderShell();
 document.getElementById('view').innerHTML=(VIEWFN[state.view]||viewDash)()+dossierHTML();
 if(state.view==='services')updateQuote();
 save();
}
function commit(key){save();render();toast(t(key))}

/* ---------- 9. modals ---------- */
function modal(html){document.getElementById('modalRoot').innerHTML='<div class="mask" data-act="closeModal"><div class="dlg">'+html+'</div></div>'}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function mHead(k){return '<div class="spread" style="margin-bottom:14px"><div><h2>'+t(k)+'</h2><p class="tiny muted">'+t('disclaimer.full')+' · '+t('save.state')+'</p></div><button class="btn sm" data-act="closeModal">×</button></div>'}
function mFoot(k){return '<div class="foot"><button class="btn" data-act="closeModal">'+t('btn.cancel')+'</button><button class="btn pri" type="submit">'+t(k||'btn.confirm')+'</button></div>'}
function memberOpts(role,unit){return state.members.filter(m=>(!role||m.role===role)&&(!unit||m.unit===unit)).map(m=>'<option value="'+m.id+'">'+esc(m.name)+' · '+esc(regionName(region(m.region)))+' · '+m.unit+' ('+money(balOf(m.id,m.unit))+')</option>').join('')}
function confirmModal(title,body,act,id){
 modal(mHeadPlain(title)+'<div class="notice">'+body+'</div><div class="foot"><button class="btn" data-act="closeModal">'+t('btn.cancel')+'</button><button class="btn pri" data-act="'+act+'" data-id="'+(id||'')+'">'+t('btn.confirm')+'</button></div>');
}
function mHeadPlain(s){return '<div class="spread" style="margin-bottom:14px"><h2>'+esc(s)+'</h2><button class="btn sm" data-act="closeModal">×</button></div>'}
const MODALS={
 pay(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const ch=o.unit==='EACO'?CH_EACO:CH_CNH;
  modal(mHead('ord.payTitle')+'<form data-form="pay" data-id="'+o.id+'">'+
   '<div class="notice" style="margin-bottom:12px"><b>'+o.id+'</b> · '+esc(svcName(service(o.sid)))+'<br>'+t('ord.amountDue')+': <b>'+money(o.pay)+' '+o.unit+'</b> · '+t('ord.offset')+' '+money(o.off)+' '+o.unit+'<br>'+schemeChip(schemeOf(o.region))+' '+t('scheme.'+(o.unit==='EACO'?'a':'b').toLowerCase())+'</div>'+
   (o.unit==='EACO'?'<div class="notice tiny" style="margin-bottom:12px"><b>'+t('chain.solana')+'</b> · '+esc(EACO.chain)+' · CA '+esc(EACO.ca.slice(0,8))+'…'+esc(EACO.ca.slice(-6))+'<br>'+t('sol.sub')+'</div>':'')+
   '<div class="field"><label class="fl">'+t('ord.channel')+'</label><select name="channel">'+ch.map(c=>'<option value="'+esc(state.lang==='zh'?c[1]:c[2])+'">'+esc(state.lang==='zh'?c[1]:c[2])+'</option>').join('')+'</select></div>'+
   '<div class="notice tiny">'+t('disclaimer.short')+'</div>'+mFoot('ord.confirmPay')+'</form>');
 },
 assign(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const opts=memberOpts('booster',o.unit);
  modal(mHead('ord.assignTitle')+'<form data-form="assign" data-id="'+o.id+'">'+
   '<div class="field"><label class="fl">'+t('ord.chooseBooster')+'</label><select name="bid">'+(opts||'<option value="">-</option>')+'</select></div>'+
   '<div class="notice tiny">'+t('ord.sameUnit')+'</div>'+mFoot('btn.confirm')+'</form>');
 },
 settle(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const b=o.bid?member(o.bid):null;
  modal(mHeadPlain(t('ord.settleTitle'))+'<div class="quote-line"><span>'+t('ord.service')+'</span><span>'+esc(svcName(service(o.sid)))+'</span></div>'+
   '<div class="quote-line"><span>'+t('ord.payable')+'</span><span class="mono">'+money(o.pay)+' '+o.unit+'</span></div>'+
   '<div class="quote-line"><span>'+t('ord.commission')+'</span><span class="mono">'+money(o.commission)+'</span></div>'+
   '<div class="quote-line"><span>'+t('ord.reward')+'</span><span class="mono">'+money(o.reward)+'</span></div>'+
   '<div class="quote-line"><span>'+t('ord.retain')+'</span><span class="mono">'+money(o.retain)+'</span></div>'+
   '<div class="quote-line"><span>'+t('ord.booster')+'</span><span>'+esc(b?b.name:'-')+'</span></div>'+
   '<div class="quote-line"><span>'+t('ord.ref')+'</span><span class="mono tiny">'+esc(o.ref)+'</span></div>'+
   '<div class="foot"><button class="btn pri" data-act="closeModal">'+t('btn.close')+'</button></div>');
 },
 topup(){modal(mHead('led.topupTitle')+'<form data-form="topup">'+
  '<div class="field"><label class="fl">'+t('team.name')+'</label><select name="mid">'+memberOpts()+'</select></div>'+
  '<div class="field"><label class="fl">'+t('led.amount')+'</label><input type="number" name="amount" min="1" step="0.01" value="100"></div>'+
  '<div class="notice tiny">'+t('region.auto')+' · '+t('led.exchangeNote')+'</div>'+mFoot('led.topup')+'</form>')},
 exchange(){modal(mHead('led.exchangeTitle')+'<form data-form="exchange">'+
  '<div class="field"><label class="fl">'+t('team.name')+'</label><select name="mid">'+memberOpts()+'</select></div>'+
  '<div class="f2"><div class="field"><label class="fl">'+t('led.direction')+'</label><select name="dir"><option value="c2e">'+t('led.c2e')+'</option><option value="e2c">'+t('led.e2c')+'</option></select></div>'+
  '<div class="field"><label class="fl">'+t('led.amount')+'</label><input type="number" name="amount" min="1" step="0.01" value="20"></div></div>'+
  '<div class="notice tiny">'+t('led.exchangeNote')+'</div>'+mFoot('led.exchange')+'</form>')},
 withdraw(){modal(mHead('led.withdrawTitle')+'<form data-form="withdraw">'+
  '<div class="field"><label class="fl">'+t('team.name')+'</label><select name="mid">'+memberOpts()+'</select></div>'+
  '<div class="field"><label class="fl">'+t('led.amount')+'</label><input type="number" name="amount" min="1" step="0.01" value="50"></div>'+
  '<div class="notice tiny">'+t('disclaimer.short')+'</div>'+mFoot('led.withdraw')+'</form>')},
 addMember(){modal(mHead('team.addTitle')+'<form data-form="addMember">'+
  '<div class="field"><label class="fl">'+t('team.name')+'</label><input type="text" name="name" required maxlength="40" placeholder="Kai / 阿凯"></div>'+
  '<div class="f2"><div class="field"><label class="fl">'+t('team.role')+'</label><select name="role"><option value="client">'+t('role.client')+'</option><option value="booster">'+t('role.booster')+'</option><option value="admin">'+t('role.admin')+'</option></select></div>'+
  '<div class="field"><label class="fl">'+t('team.region')+'</label><select name="region">'+REGIONS.map(r=>'<option value="'+r.c+'">'+esc(regionName(r))+' · '+unitOf(r.c)+'</option>').join('')+'</select></div></div>'+
  '<div class="field"><label class="fl">'+t('team.initial')+'</label><input type="number" name="initial" min="0" step="0.01" value="100"></div>'+
  '<div class="notice tiny">'+t('region.auto')+'</div>'+mFoot('team.add')+'</form>')},
 changeRegion(id){const m=member(id);if(!m)return;
  modal(mHeadPlain(t('team.changeRegion'))+'<form data-form="changeRegion" data-id="'+id+'">'+
   '<div class="notice" style="margin-bottom:12px"><b>'+esc(m.name)+'</b> · '+esc(regionName(region(m.region)))+' · '+m.unit+'<br>'+t('led.exchangeNote')+'</div>'+
   '<div class="field"><label class="fl">'+t('team.region')+'</label><select name="region">'+REGIONS.map(r=>'<option value="'+r.c+'" '+(r.c===m.region?'selected':'')+'>'+esc(regionName(r))+' · '+unitOf(r.c)+'</option>').join('')+'</select></div>'+mFoot('btn.save')+'</form>')}
};

/* ---------- 10. actions & forms ---------- */
const ACTIONS={
 nav(id){state.view=id;save();render();window.scrollTo({top:0,behavior:'smooth'})},
 lang(id){state.lang=id;save();render()},
 theme(id){state.theme=id;save();render();toast(t('theme.desc.'+id))},
 export(){downloadTxt()},
 import(){document.getElementById('importFile').click()},
 gotoDossier(){const el=document.getElementById('dossier');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},
 copyCA(){const s=EACO.ca;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>toast(t('msg.caCopied'))).catch(()=>toast(t('msg.caCopied')))}else{const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(err){}ta.remove();toast(t('msg.caCopied'))}},
 copyTxt(){const s=buildTxt();navigator.clipboard?.writeText(s).then(()=>toast(t('msg.copied'))).catch(()=>{const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(t('msg.copied'))})},
 clearLog(){confirmModal(t('mem.clearLog'),t('mem.clearWarn'),'doClearLog')},
 doClearLog(){state.log=[];closeModal();commit('mem.cleared')},
 resetDemo(){confirmModal(t('mem.reset'),t('mem.resetWarn'),'doResetDemo')},
 doResetDemo(){closeModal();seedDemo();render();toast(t('msg.demo'))},
 closeModal(id,el,ev){if(el&&el.classList&&el.classList.contains('mask')&&ev&&ev.target!==el)return;closeModal()},
 placeOrder(){
  const v=quoteVals();if(!v){toast(t('msg.noMember'));return}
  placeOrder(state.draft);
  state.view='orders';commit('msg.orderCreated');
 },
 pay(id){MODALS.pay(id)},
 assign(id){MODALS.assign(id)},
 settle(id){MODALS.settle(id)},
 topup(){MODALS.topup()},
 exchange(){MODALS.exchange()},
 withdraw(){MODALS.withdraw()},
 addMember(){MODALS.addMember()},
 changeRegion(id){MODALS.changeRegion(id)},
 start(id){const o=state.orders.find(x=>x.id===id);if(o){o.status='working';logEvent('订单 '+o.id+' 开始带打','Boosting started for '+o.id);commit('msg.started')}},
 finish(id){if(finishOrder(id))commit('msg.finished');else toast(t('msg.required'))},
 cancelOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;
  confirmModal(t('ord.refund'),esc(o.ref||'-')+'<br>'+t('ord.refundWarn'),'doCancel',id)},
 doCancel(id){if(cancelOrder(id)){closeModal();commit('msg.cancelled')}},
 delMember(id){const m=member(id);if(!m)return;
  confirmModal(t('team.delete')+' · '+m.name,esc(m.name)+' · '+t('team.delWarn'),'doDelMember',id)},
 doDelMember(id){removeMember(id);closeModal();commit('msg.memberDeleted')}
};
function val(f,n){const el=f.elements.namedItem(n);return el?String(el.value):''}
const FORMS={
 pay(f){
  const o=state.orders.find(x=>x.id===f.dataset.id);if(!o)return;
  const ch=val(f,'channel').trim()||'-';
  if(payOrder(o.id,ch)){closeModal();commit('msg.paid')}
 },
 assign(f){
  const bid=val(f,'bid');if(!bid){toast(t('msg.pickBooster'));return}
  if(assignOrder(f.dataset.id,bid)){closeModal();commit('msg.assigned')}else toast(t('msg.required'));
 },
 topup(f){
  const x=round(Number(val(f,'amount')));if(x<=0){toast(t('msg.negative'));return}
  topup(val(f,'mid'),x);closeModal();commit('msg.topup');
 },
 exchange(f){
  const r=exchange(val(f,'mid'),val(f,'dir'),round(Number(val(f,'amount'))));
  if(r===true){closeModal();commit('msg.exchange')}else toast(t(r==='insufficient'?'msg.insufficient':r==='noEaco'?'led.noEaco':'msg.negative'));
 },
 withdraw(f){
  const r=withdraw(val(f,'mid'),round(Number(val(f,'amount'))));
  if(r===true){closeModal();commit('msg.withdraw')}else toast(t(r==='insufficient'?'msg.insufficient':'msg.negative'));
 },
 addMember(f){
  const n=val(f,'name').trim();if(!n){toast(t('msg.required'));return}
  addMember(n,val(f,'role'),val(f,'region'),Math.max(0,round(Number(val(f,'initial')))));
  closeModal();commit('msg.memberAdded');
 },
 changeRegion(f){
  const r=changeRegion(f.dataset.id,val(f,'region'));
  if(r===true){closeModal();commit('msg.regionChanged')}
  else if(r==='blocked'){closeModal();toast(t('team.regionBlocked'))}
  else if(r==='same'){closeModal();toast(t('msg.sameRegion'))}
  else toast(t('msg.required'));
 }
};

/* ---------- 11. event wiring ---------- */
document.addEventListener('click',function(ev){
 const el=ev.target.closest('[data-act]');if(!el)return;
 const fn=ACTIONS[el.dataset.act];if(fn){ev.preventDefault();fn(el.dataset.id,el,ev)}
});
document.addEventListener('submit',function(ev){
 const f=ev.target;if(!f.dataset.form)return;
 ev.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f);
});
document.addEventListener('change',function(ev){
 const el=ev.target;
 if(el.dataset.draft){
  const k=el.dataset.draft;
  state.draft[k]=el.type==='checkbox'?el.checked:(k==='qty'||k==='diff'?Number(el.value):el.value);
  if(k==='qty'&&(state.draft.qty<1||!Number.isFinite(state.draft.qty)))state.draft.qty=1;
  save();updateQuote();renderShell();return;
 }
 if(el.dataset.filter){state.filters[el.dataset.filter]=el.value;save();render();return}
});
document.addEventListener('input',function(ev){
 const el=ev.target;
 if(el.dataset.notes!==undefined){state.notes=el.value;clearTimeout(el._tm);el._tm=setTimeout(()=>{save();const c=document.getElementById('saveChip');if(c)c.textContent=t('save.state')+' · '+t('save.ok');const p=document.getElementById('txtPreview');if(p){const x=buildTxt();p.textContent=x.slice(0,9000)+(x.length>9000?'\n... ('+x.length+' chars)':'')}},350);return}
 if(el.dataset.search!==undefined){clearTimeout(searchTimer);const v=el.value;searchTimer=setTimeout(()=>{state.filters.q=v;save();render();const n=document.querySelector('[data-search]');if(n){n.focus();n.setSelectionRange(v.length,v.length)}},380)}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeModal()});
document.getElementById('importFile').addEventListener('change',function(ev){
 const file=ev.target.files&&ev.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{importTxt(String(r.result||''));ev.target.value=''};
 r.onerror=()=>{toast(t('msg.importFail'));ev.target.value=''};
 r.readAsText(file,'utf-8');
});

/* ---------- 12. boot ---------- */
(function boot(){
 let loaded=false;
 try{
  const raw=localStorage.getItem(KEY);
  if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.entries)&&Array.isArray(o.members)){
   state=o;state.draft=state.draft||{memberId:'',serviceId:'S1',qty:1,diff:1,usePoints:true};
   state.filters=state.filters||{unit:'ALL',type:'ALL',q:''};state.notes=state.notes||'';state.log=state.log||[];
   state.lang=state.lang||'zh';state.theme=state.theme||'kr';state.view=state.view||'dash';state.seq=state.seq||1;
   loaded=true;
  }}
 }catch(err){console.warn('state restore failed',err)}
 if(!loaded)seedDemo();
 render();
})();
</script>
